  <main class="artigo">
    <article class="login-container">
      <h1>Entrar</h1>

      <div class="login-tabs">
        <button id="tabLogin" class="tab-ativa">Entrar</button>
        <button id="tabCadastro">Cadastro</button>
      </div>

      <form id="formLogin">
        <label for="loginEmail">E-mail:</label>
        <input type="email" id="loginEmail" required>

        <label for="loginSenha">Senha:</label>
        <input type="password" id="loginSenha" required>

        <button type="submit">Entrar</button>
      </form>

      <form id="formCadastro" class="escondido">
        <label for="cadNome">Nome:</label>
        <input type="text" id="cadNome" required>

        <label for="cadEmail">E-mail:</label>
        <input type="email" id="cadEmail" required>

        <label for="cadSenha">Senha:</label>
        <input type="password" id="cadSenha" required minlength="4">

        <button type="submit">Cadastrar</button>
      </form>
    </article>
  </main>
